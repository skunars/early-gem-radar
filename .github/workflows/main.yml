name: Early Gem Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'i indir
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scanner çalıştır
        run: python scanner.py

      - name: Geçmiş ve paper verisini GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/candidates.json data/paper_trades.json data/radar_state.json

          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Persist radar and paper trading state"
            git push
          fi
